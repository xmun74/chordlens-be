name: CI-CD-server

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ── CI: 의존성 설치 + 테스트 (push/PR 모두 실행) ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # chord-extractor(librosa/soundfile) 런타임 오디오 디코딩 의존
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1

      # prod(Dockerfile)와 동일한 설치 순서: vamp(setup.py)가 numpy를 빌드 타임에 요구.
      # requirements.txt를 그대로 설치하므로 의존성/버전 오류 검출
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.24"
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest tests/ -v

  # ── CD: main push에서 test 통과 시에만 EC2 배포 ──
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: |
            # 빌드 등 어느 단계라도 실패하면 즉시 중단 → 실행 중인 컨테이너를 내리지 않는다.
            # (docker build 실패 시 stop/rm/run 으로 진행해 구 이미지로 재기동되는 사고 방지)
            set -e
            cd ~/chordlens-be
            git pull origin main
            docker build -t chordlens-be .
            # 빌드 성공 이후에만 컨테이너 교체. 미존재 시 에러는 무시(|| true).
            docker stop chordlens-be || true
            docker rm chordlens-be || true
            docker run -d \
              --name chordlens-be \
              --restart unless-stopped \
              -p 8000:8000 \
              --env-file .env \
              -v /home/ubuntu/youtube-cookies.txt:/app/youtube-cookies.txt:ro \
              chordlens-be
